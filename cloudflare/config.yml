# ─────────────────────────────────────────────────────────────────────────────
# cloudflared daemon configuration — DFS Coordinator Tunnel
#
# TEMPLATE FILE — fill in the values marked with <...> before running.
# See docs/cloudflare_tunnel_setup.md for the complete setup walkthrough.
#
# This file is committed to version control.
# The credentials JSON file it references is NOT committed (see .gitignore).
# ─────────────────────────────────────────────────────────────────────────────

# ── Tunnel identity ──────────────────────────────────────────────────────────
# Replace <TUNNEL_UUID> with the UUID printed by:
#   cloudflared tunnel create dfs-tunnel
# Example: tunnel: a1b2c3d4-e5f6-7890-abcd-ef1234567890
tunnel: cc6820cd-3883-42d5-82bb-ccaf307ac825

# Path to the credentials JSON created by `cloudflared tunnel create`.
# This file contains your tunnel secret — it must NOT be committed.
# Default location after `cloudflared tunnel create dfs-tunnel`:
#   Linux/Pi:  /home/pi/.cloudflared/<TUNNEL_UUID>.json
#   macOS:     /Users/<you>/.cloudflared/<TUNNEL_UUID>.json
credentials-file: /home/pi/.cloudflared/cc6820cd-3883-42d5-82bb-ccaf307ac825.json

# ── Optional: log level ──────────────────────────────────────────────────────
# loglevel: info    # debug | info | warn | error

# ── Ingress rules ────────────────────────────────────────────────────────────
#
# ONLY the Coordinator is exposed — no storage-node ports (8001-8007).
#
# noTLSVerify: true  — required because the Coordinator uses a self-signed
#   certificate (generated by crypto_utils.py). The tunnel traffic between
#   cloudflared and Cloudflare's edge is still fully encrypted using
#   Cloudflare's own certificate. Only the last hop (cloudflared → localhost)
#   skips cert validation, which is safe on loopback.
#
ingress:
  # ── Rule 1: DFS Coordinator (the only exposed service) ────────────────────
  - hostname: dfs.flyinglockin.site    # Replace with your real CF_PUBLIC_HOSTNAME
    service: http://127.0.0.1:8000
    originRequest:         # Accept self-signed cert from coordinator
      connectTimeout: 10s
      tcpKeepAlive: 30s
      keepAliveConnections: 10

  # ── Catch-all rule (required by cloudflared) ──────────────────────────────
  # Any request that does not match rule 1 gets a 404.
  # This also means storage-node ports are NEVER routed through the tunnel.
  - service: http_status:404
